options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build the container image (--no-cache to ensure fresh build with latest code)
  # Use commit SHA as tag to force new revision
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--no-cache', '-t', 'gcr.io/$PROJECT_ID/lifecycle-analysis:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/lifecycle-analysis:latest', '.']
  
  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lifecycle-analysis:$COMMIT_SHA']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/lifecycle-analysis:latest']
  
  # Deploy to Cloud Run (use commit SHA to force new revision)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lifecycle-analysis'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lifecycle-analysis:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--allow-unauthenticated'
      - '--add-cloudsql-instances'
      - 'lifecycle-analysis-477518:us-central1:lifecycle-db'
      - '--set-secrets'
      - 'DATABASE_URL=database-url:latest,GOOGLE_CSE_API_KEY=google-cse-api:latest,GOOGLE_CSE_CX=google-cse-cx:latest,GEMINI_API_KEY=gemini-api-key:latest'
      - '--set-env-vars'
      - 'GEMINI_MODEL=gemini-1.5-flash'

timeout: '1200s'
